name: stage75a-v21-quantifier

on:
  push:
    branches:
      - audit/v21-stage75a-generality-quantifier
  pull_request:
    paths:
      - 'paper/**'
      - 'sections/**'
      - 'generated/**'
      - 'scripts/generate_results.py'
      - 'scripts/generate_tables.py'
      - 'scripts/stage75a_scope_audit.py'
      - 'reviews/STAGE_075A_V21_GENERALITY_QUANTIFIER_RED_TEAM_2026-09-10.md'
      - '.github/workflows/stage75a-v21-quantifier.yml'

permissions:
  contents: read

jobs:
  quantifier-scope-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Regenerate repaired result layer
        run: |
          python scripts/generate_results.py
          python scripts/generate_tables.py
      - name: Run Stage 7.5A scope audit
        run: python scripts/stage75a_scope_audit.py
      - name: Check generated files are reproducible
        run: git diff --exit-code -- generated/results/canonical_results.json generated/tables
