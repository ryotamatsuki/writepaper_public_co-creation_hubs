name: analytic-level3
on:
  pull_request:
    paths:
      - 'analytic_level3/**'
      - '.github/workflows/analytic-level3.yml'
  workflow_dispatch:

concurrency:
  group: writepaper_public_co-creation_hubs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  analytic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install -r requirements.txt
      - run: python analytic_level3/code/verify_symbolic_identities.py
      - run: python analytic_level3/code/verify_threshold.py
      - run: python analytic_level3/code/verify_witness.py
