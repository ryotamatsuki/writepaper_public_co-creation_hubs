name: Kappa minimal exploration and frozen model integrity
on:
  push:
    branches:
      - exploration/stage12-kappa-minimal-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve every original tracked file and exact local algebra
        run: |
          python exploration_kappa_20261028/integrity_check.py
          python exploration_kappa_20261028/local_checks.py
          python exploration_kappa_20261028/exact_threshold.py
      - name: Unchanged exact frozen certificates
        working-directory: hotelling_entry_experimentation/production/reviews
        run: |
          python stage11r_pp_global_certificate.py
          python stage11r_p1_open_region_certificate.py
          python stage11r_p1b_empirical_implications_check.py
          python stage11r_p1c_reduction_check.py
      - name: Numerical dependencies
        run: python -m pip install -r exploration_kappa_20261028/requirements.txt
      - name: Original reproduction and extended numerical diagnostics
        run: |
          python hotelling_entry_experimentation/production/verification/stage33_reproduce.py
          python exploration_kappa_20261028/numerics.py
          python exploration_kappa_20261028/numerics.py --seed-checks
      - uses: actions/upload-artifact@v4
        with:
          name: kappa-exploration-checks-not-full-game-certification
          path: exploration_kappa_20261028/*.json
          retention-days: 30
