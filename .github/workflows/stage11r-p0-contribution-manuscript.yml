name: Stage11R P0 contribution focus and proof-verifiability QA
on:
  push:
    branches:
      - revision/stage11r-p0-contribution-focus-20261028
  pull_request:
    branches:
      - audit/stage11r-p0-pp-global-price-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck exact rational P/P continuation and all 16 profiles
        working-directory: hotelling_entry_experimentation/production/reviews
        run: python stage11r_pp_global_certificate.py
      - name: Recheck original frozen baseline
        working-directory: hotelling_entry_experimentation/production
        run: python verification/stage33_reproduce.py
  latex-source-and-bibliography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all theory sections and bibliography
        uses: xu-cheng/latex-action@v4
        with:
          root_file: manuscript/main.tex
          working_directory: hotelling_entry_experimentation/production
          compiler: latexmk
          args: -pdf -bibtex -file-line-error -halt-on-error -interaction=nonstopmode
          texlive_version: 2026
      - name: Upload proof-check working PDF (not submission proof)
        uses: actions/upload-artifact@v4
        with:
          name: stage11r-p0-contribution-working-manuscript
          path: hotelling_entry_experimentation/production/main.pdf
          if-no-files-found: error
          retention-days: 14
