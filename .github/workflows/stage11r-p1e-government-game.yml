name: Frozen government-entry game exploratory certificate
on:
  push:
    branches:
      - exploration/stage11r-p1e-government-cycle-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  government-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck original global P/P price and entry certificate
        working-directory: hotelling_entry_experimentation/production/reviews
        run: python stage11r_pp_global_certificate.py
      - name: Exact rational government-game audit
        run: python hotelling_entry_experimentation/production/government_game_exploration/government_game_certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-government-game-certificate
          path: |
            hotelling_entry_experimentation/production/government_game_exploration/government_game_certificate.json
            hotelling_entry_experimentation/production/reviews/stage11r_pp_global_certificate.json
