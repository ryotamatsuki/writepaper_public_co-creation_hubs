name: stage4-v21-global-repair

on:
  push:
    branches:
      - repair/v21-stage4-all-regime-global
    paths:
      - 'stage4_v21_global/**'
      - '.github/workflows/stage4-v21-global-repair.yml'
  pull_request:
    paths:
      - 'stage4_v21_global/**'
      - '.github/workflows/stage4-v21-global-repair.yml'

permissions:
  contents: read

jobs:
  all-regime-global-search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade numpy scipy sympy
      - name: Search existing rho primitive for global sign-reversal region
        run: python stage4_v21_global/code/rho_global_region_search.py
