name: P1k main-theorem rival mechanism test
on:
  push:
    branches:
      - exploration/stage11r-p1k-main-theorem-adversarial-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact proof endogenous pricing vs fee-frozen incidence paradox
        run: python hotelling_entry_experimentation/production/government_game_exploration/repricing_counterfactual_sign_certificate.py
      - name: Exact incumbent sign/threshold derivative full-rectangle certificate
        run: python hotelling_entry_experimentation/production/government_game_exploration/incidence_screening_sign_certificate.py
      - name: Regression original global PP and all 16 first-stage entry checks
        run: python hotelling_entry_experimentation/production/reviews/stage11r_pp_global_certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: main-theorem-sign-flip-rational-certificates
          path: |
            hotelling_entry_experimentation/production/government_game_exploration/repricing_counterfactual_sign_results.json
            hotelling_entry_experimentation/production/government_game_exploration/incidence_screening_sign_results.json
