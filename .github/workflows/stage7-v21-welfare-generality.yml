name: stage7-v21-welfare-generality

on:
  push:
    branches:
      - analysis/v21-stage7-welfare-generality
    paths:
      - 'stage7_v21/**'
      - 'reviews/STAGE_07_V21_WELFARE_GENERALITY_2026-09-09.md'
      - '.github/workflows/stage7-v21-welfare-generality.yml'
  pull_request:
    paths:
      - 'stage7_v21/**'
      - 'reviews/STAGE_07_V21_WELFARE_GENERALITY_2026-09-09.md'
      - '.github/workflows/stage7-v21-welfare-generality.yml'

permissions:
  contents: read

jobs:
  welfare-generality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run Stage 7 welfare audit
        run: python stage7_v21/code/welfare_generality_audit.py
