name: P1k candidate headline theorem adversarial audit
on:
  push:
    branches:
      - review/stage11r-p1k-headline-theorem-value-20261028
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact finite-gamma incidence-screening derivative over entire rectangle
        run: python hotelling_entry_experimentation/production/government_game_exploration/incidence_screening_sign_certificate.py
      - name: Independently certify positive public willingness to pay and negative regional venture returns
        run: python hotelling_entry_experimentation/production/government_game_exploration/incidence_screening_valuation_check.py
      - name: Baseline global-price and all four entrant equilibrium regression
        run: python hotelling_entry_experimentation/production/reviews/stage11r_pp_global_certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: p1k-sign-and-economic-value-proof
          path: |
            hotelling_entry_experimentation/production/government_game_exploration/incidence_screening_sign_results.json
            hotelling_entry_experimentation/production/government_game_exploration/incidence_screening_valuation_check.json
