name: Stage33 Stage9 production reproducibility
on:
  pull_request:
    branches:
      - research/hotelling-entry-experimentation
    paths:
      - 'hotelling_entry_experimentation/production/**'
      - '.github/workflows/stage33-stage9-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline-reproduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recalculate frozen baseline and generate deterministic table
        working-directory: hotelling_entry_experimentation/production
        run: |
          make check
          make data
          test "$(wc -l < output/stage33_profiles.csv)" -eq 49
      - name: Publish 48-profile reproducibility table
        uses: actions/upload-artifact@v4
        with:
          name: stage33-stage9-profiles
          path: hotelling_entry_experimentation/production/output/stage33_profiles.csv
  manuscript-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX compiler and bibliography tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern
      - name: Compile provisional modular manuscript with bibliography
        working-directory: hotelling_entry_experimentation/production
        run: make paper
      - name: Publish Stage9 draft PDF
        uses: actions/upload-artifact@v4
        with:
          name: stage33-stage9-provisional-manuscript
          path: hotelling_entry_experimentation/production/build/main.pdf
