name: Stage11R P0 global P/P fee and first-stage exact certificate

on:
  push:
    branches:
      - audit/stage11r-p0-pp-global-price-20261028
    paths:
      - hotelling_entry_experimentation/production/reviews/stage11r_pp_global_certificate.py
      - .github/workflows/stage11r-pp-price-certificate.yml
      - hotelling_entry_experimentation/production/reviews/STAGE11R_P0_PP_GLOBAL_CERTIFICATE_2026-10-28.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-baseline-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotelling_entry_experimentation/production/reviews
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact rational P/P price and four-actor entry audit
        run: python stage11r_pp_global_certificate.py
      - name: Upload raw proof-sign register
        uses: actions/upload-artifact@v4
        with:
          name: stage11r-pp-global-rational-certificate
          path: hotelling_entry_experimentation/production/reviews/stage11r_pp_global_certificate.json
          retention-days: 30
