name: stage10-v21-paper-build

on:
  push:
    branches:
      - pipeline/v21-stage10-paper
      - audit/v21-stage11-referee
      - position/v21-stage12-journal
      - integration/v21-stage13
      - qa/v21-stage14
      - freeze/v21-stage15
  pull_request:

permissions:
  contents: read

jobs:
  paper-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Final Stage-9 ancestry gate
        run: git merge-base --is-ancestor 63c5f8c2627e97be6874438ca6af16e1df1c338a HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python environment
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: LaTeX environment
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra

      - name: Clean full paper-build gate
        run: make clean && make all

      - name: Explicit Stage-10 architecture gate
        run: python scripts/validate_stage10_architecture.py

      - name: Final claim-scope regression
        run: python scripts/stage75a_scope_audit.py

      - name: Preserve historical frozen sources; allow explicit T3 amendment
        run: |
          git diff --exit-code 63c5f8c2627e97be6874438ca6af16e1df1c338a -- \
            theory_freeze_v21/CANONICAL_THEORY_FREEZE_2026-09-10.md \
            stage4a_v21_repaired \
            analytic_level3 \
            reviews/STAGE_075A_V21_GENERALITY_QUANTIFIER_RED_TEAM_2026-09-10.md
          test -f theory_freeze_v21/STAGE_08_V21_T3_SYMMETRY_AMENDMENT_2026-09-10.md
          test -f reviews/STAGE_075A_V21_T3_SYMMETRY_LIMITED_REOPEN_2026-09-10.md
