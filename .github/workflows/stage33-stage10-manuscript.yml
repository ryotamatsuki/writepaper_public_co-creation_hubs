name: Stage33 Stage10 manuscript and reproducibility
on:
  pull_request:
    branches:
      - stage9/stage33-reproducibility-manuscript-setup-20261028
      - research/hotelling-entry-experimentation
    paths:
      - 'hotelling_entry_experimentation/production/**'
      - '.github/workflows/stage33-stage10-manuscript.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce the frozen calibration and 48-row panel
        working-directory: hotelling_entry_experimentation/production
        run: |
          make check
          make data
          test "$(wc -l < output/stage33_profiles.csv)" -eq 49
      - uses: actions/upload-artifact@v4
        with:
          name: stage10-frozen-baseline-48-profiles
          path: hotelling_entry_experimentation/production/output/stage33_profiles.csv
  latex-and-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and BibTeX toolchain
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra lmodern
      - name: Build full Stage10 draft
        working-directory: hotelling_entry_experimentation/production
        run: |
          make paper
          test -s build/main.pdf
          ! grep -E 'Citation .* undefined|Reference .* undefined' build/main.log
      - uses: actions/upload-artifact@v4
        with:
          name: stage10-integrated-theory-manuscript-pdf
          path: hotelling_entry_experimentation/production/build/main.pdf
